name: slimproxy-udpnat-capacity

on:
  push:
    branches:
      - slimproxy-udpnat-capacity
  pull_request:
    branches:
      - main
      - dev
      - slimproxy-udpnat-capacity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: udpnat fork tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Vet
        run: go vet ./common/udpnat ./common/cache
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Repeat udpnat generation and queue regressions
        run: go test -race -count=10 ./common/udpnat
